# Cut a GitHub Release when you push a semver tag: git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  # GitHub Container Registry image (pulled on EC2 / compose — not just release notes)
  IMAGE_NAME: ghcr.io/${{ github.repository }}/os-brain

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Shared build
        run: npm run build -w @juvantage/shared

      - name: Prisma generate
        working-directory: apps/api
        env:
          DATABASE_URL: "file:./ci.db"
        run: npx prisma generate

      - name: API tests
        working-directory: apps/api
        env:
          DATABASE_URL: "file:./ci.db"
          JWT_SECRET: "ci-jwt-secret-not-for-production"
          TOKEN_ENCRYPTION_KEY: "ci-token-encryption-key"
          DEMO_MODE: "true"
          PORT: "3001"
        run: npm test

      - name: API build
        working-directory: apps/api
        env:
          DATABASE_URL: "file:./ci.db"
        run: npm run build

      - name: Desktop typecheck
        working-directory: apps/desktop
        run: npx tsc --noEmit

      - name: Docker build smoke
        run: docker build -f apps/api/Dockerfile -t juvantage/os-brain:ci-${{ github.sha }} .
  publish-ghcr:
    name: Publish Brain image (GHCR)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build os-brain image
        run: |
          VERSION="${{ github.ref_name }}"
          docker build -f apps/api/Dockerfile -t "${{ env.IMAGE_NAME }}:${VERSION}" .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push versioned image
        run: |
          VERSION="${{ github.ref_name }}"
          docker push "${{ env.IMAGE_NAME }}:${VERSION}"

      - name: Push major.minor alias
        run: |
          VERSION="${{ github.ref_name }}"
          MINOR="${VERSION#v}"
          MINOR="${MINOR%.*}"
          docker tag "${{ env.IMAGE_NAME }}:${VERSION}" "${{ env.IMAGE_NAME }}:v${MINOR}"
          docker push "${{ env.IMAGE_NAME }}:v${MINOR}"

  github-release:
    name: GitHub Release page
    needs: [validate, publish-ghcr]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            docker-compose.yml
          body: |
            ## Brain (hosted / EC2)

            Pull the **exact** API image built for this tag:

            ```bash
            docker pull ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```

            Package: [ghcr.io packages](https://github.com/${{ github.repository }}/pkgs/container/os-brain)

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
