name: CI failure → Jira

# Opens a Jira ticket only for real main regressions (not PR flakes).
# Rules live in tools/jira/ci-open-ticket.mjs.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-failure-jira
  cancel-in-progress: false

jobs:
  maybe-open-ticket:
    name: Maybe open Jira ticket
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.event == 'push'
      && (github.event.workflow_run.head_branch == 'main'
          || github.event.workflow_run.head_branch == 'master')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Open or update Jira ticket
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: CI
        run: node tools/jira/ci-open-ticket.mjs
